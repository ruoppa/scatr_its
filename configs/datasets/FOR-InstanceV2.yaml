# Configuration for FOR-InstanceV2 in the original PLY format (FIV2_las.yaml for the format used in the SCATR-ITS paper)
dataset:
  dataset_name: FOR-InstanceV2
  type: ForestDataset
  data_root: /workspaces/scatr_its/data

  preprocess:
    raw_data_dir: raw_data
    preprocessed_data_dir: preprocessed_data
    input_data_dir: input_data
    training_dir: train_val_data
    validation_dir: train_val_data
    test_dir: test_data
    feat_to_load: ~
    max_n_points: ~
    file_extension: ply
    instance_field: treeID
    semantic_field: semantic_seg
    ignore_semantic_classes: ~
    non_instance_id: 0
    semantic_class_mapping: {
      1: 0,
      2: 1,
      3: 1,
    }

  general:
    num_semantic_classes: 2
    semantic_class_names: {
      0: other,
      1: tree
    }
    instance_class_names: {
      1: tree,
    }
    data_dim: 3
    use_dim: [0, 1, 2]
  
  output:
    output_data_dir: predictions
    superpoint_data_dir: superpoints
    file_extension: ply
    instance_pred_field: tree_pred
    semantic_pred_field: semantic_pred
    score_pred_field: score

  accuracy:
    metadata_file: ~
    iou_thresh: 0.5
    metric_list: [precision, recall, f1, cov, ap, iou, br, bp, rr]
    ignore_classes: ${dataset.preprocess.ignore_semantic_classes}
    filter_small_instances: True
    min_instance_points: 40
    min_instance_h: 1.5

  data_split:

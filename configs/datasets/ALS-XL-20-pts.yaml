    input_data_dir: input_data
    training_dir: training
    validation_dir: validation
    test_dir: test
    feat_to_load: ~
    max_n_points: ~
    file_extension: las
    instance_field: tree_index
    semantic_field: classification
    ignore_semantic_classes: ~
    non_instance_id: 0
    semantic_class_mapping: ~

  general:
    num_semantic_classes: 2
    semantic_class_names: {
      0: other,
      1: tree
    }
    instance_class_names: {
      1: tree,
    }
    data_dim: 3
    use_dim: [0, 1, 2]
  
  output:
    output_data_dir: predictions
    superpoint_data_dir: superpoints
    file_extension: las
    instance_pred_field: tree_pred
    semantic_pred_field: semantic_pred
    score_pred_field: score

  accuracy:
    metadata_file: ~
    iou_thresh: 0.5
    metric_list: [precision, recall, f1, cov, ap, iou, br, bp, rr]
    ignore_classes: ${dataset.preprocess.ignore_semantic_classes}
    filter_small_instances: True

dataset:
  dataset_name: FGI-EMIT
  type: ForestDataset
  data_root: /workspaces/scatr_its/data

  preprocess:
    raw_data_dir: raw_data
    preprocessed_data_dir: preprocessed_data
    input_data_dir: input_data
    training_dir: training
    validation_dir: training
    test_dir: test
    feat_to_load: [red, green, blue]
    max_n_points: ~
    file_extension: las
    instance_field: tree_index
    semantic_field: classification
    ignore_semantic_classes: [5]
    non_instance_id: 0
    semantic_class_mapping: {
      2: 0,
      3: 0,
      4: 0,
    }

  general:
    num_semantic_classes: 2
    semantic_class_names: {
      0: other,
      1: tree
    }
    instance_class_names: {
      1: tree,
    }
    data_dim: 6
    use_dim: [0, 1, 2]
  
  output:
    output_data_dir: predictions
    superpoint_data_dir: superpoints
    file_extension: las
    instance_pred_field: tree_pred
    semantic_pred_field: semantic_pred
    score_pred_field: score

  accuracy:
    metadata_file: plot_data.yaml
    iou_thresh: 0.5
    metric_list: [precision, recall, f1, cov, ctg, ap, iou, br, bp, rr]
    ignore_classes: ${dataset.preprocess.ignore_semantic_classes}
    filter_small_instances: True
    min_instance_points: 40
    min_instance_h: 1.5

  data_split:
    training: [
      plot_1001,
      plot_1003,
      plot_1005,
      plot_1009,
      plot_1010,
      plot_1013,
      plot_1020,
      plot_1023,
      plot_1024,
      plot_1027,
    ]
    validation: [
      plot_1019,
      plot_1022,
      plot_1031,
    ]
    test: [
      plot_1002,
      plot_1004,
      plot_1008,
      plot_1012,
      plot_1018,
      plot_1028,
    ]

model:
  type: SCATR_ITS
  in_channels: ${channel_count:${dataset.general.use_dim}}
  num_channels: 32
  voxel_size: 0.2
  num_semantic_classes: ${dataset.general.num_semantic_classes}
  prepare_epochs: 5 #1000
  radius: 12
  step_size_ratio: 0.25
  num_points: 640000
  score_th: 0.3
  overlap_th: 0.3
  cylinder_stride_mode: max_stride
  max_object_size: 6

  backbone:
    type: SpConvUNet
    # Custom OmegaConf resolver creates channel counts dynamically (see util/config.py)
    num_planes: ${channel_list:${model.num_channels},5}

  decoder:
    type: QueryDecoder
    in_channels: ${model.num_channels}
    num_semantic_queries: ${dataset.general.num_semantic_classes}

  dynamic_query_module:
    type: DynamicQueryModule
    in_channels: ${model.num_channels}
    bins: {
      0: 50,
      5: 100,
      10: 300,
      25: 450,
      50: 600,
    }
    ordinal: True
  
  criterion:
    type: ForestUnifiedCriterion
    num_semantic_classes: ${dataset.general.num_semantic_classes}
  
  test_cfg:
    topk_insts: 600
    file_extension: ${dataset.output.file_extension}
    instance_pred_field: ${dataset.output.instance_pred_field}
    semantic_pred_field: ${dataset.output.semantic_pred_field}
    instance_gt_field: ${dataset.preprocess.instance_field}
    semantic_gt_field: ${dataset.preprocess.semantic_field}
    score_pred_field: ${dataset.output.score_pred_field}
    input_file_extension: ${dataset.preprocess.file_extension}

superpoint_model:
  type: SuperpointGenerator
  in_channels: ${channel_count:${dataset.general.use_dim}}
  num_channels: 32
  voxel_size: 0.2
  num_semantic_classes: ${dataset.general.num_semantic_classes}
  radius: 32
  step_size_ratio: 0.25
  num_points: 10000000
  sp_merge_mode: order
  reg_lambda_fg: 0.003
  reg_lambda_bg: 0.3
  min_size: 1
  graph_k: 8
  separate_bg_fg: True
  spatial_weight: ~
  edge_weight_mode: unit
  cylinder_stride_mode: max_stride
  max_object_size: 4
  max_iterations: ~

  backbone:
    type: SpConvUNet
    # Custom OmegaConf resolver creates channel counts dynamically (see util/config.py)
    num_planes: ${channel_list:${superpoint_model.num_channels},5}

model_training:
  train_dataloader:
    batch_size: 2
  default_hooks:
    checkpoint:
      type: CheckpointHook_
      keep_every_n_epochs: 500
  train_cfg:
    type: EpochBasedTrainLoop
    max_epochs: 8500
    val_interval: 20
  val_cfg:
    type: ValLoop
    val_interval: ${model_training.train_cfg.val_interval}

superpoint_model_training:
  train_dataloader:
    batch_size: 2
  default_hooks:
    checkpoint:
      type: CheckpointHook_
      keep_every_n_epochs: 100
  train_cfg:
    type: EpochBasedTrainLoop
    max_epochs: 1000
    val_interval: 10
  val_cfg:
    type: ValLoop
    val_interval: ${superpoint_model_training.train_cfg.val_interval}
[metadata]
name = torch-graph-components
version = 0.1.1
description = Fast GPU graph components and partitioning algorithms for PyTorch
long_description = file: README.md
long_description_content_type = text/markdown
author = Damien Robert, Louis Geist, Loic Landrieu
license = MIT
url = https://github.com/drprojects/torch-graph-components

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8,<3.14
install_requires =

[options.extras_require]
pyg =
    torch-geometric
torch-scatter =
    torch-scatter
torch =
    torch>=1.13

[options.packages.find]
where = src
